name: Monthly refresh

on:
  schedule:
    - cron: "0 6 3 * *"   # 06:00 UTC on the 3rd of each month
  workflow_dispatch: {}    # run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Raw data is too big for git, so it's cached between runs. The first run does the full crawl.
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: Tests
        run: PYTHONPATH=src pytest -q

      - name: Refresh pipeline
        env:
          CRM_CONTACT_EMAIL: ${{ secrets.CRM_CONTACT_EMAIL }}
        run: make refresh

      - name: Commit updated marts and reports
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add data/marts reports
          git diff --cached --quiet || git commit -m "Monthly data refresh $(date +%Y-%m)"
          git push
